[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-api-learning"
version = "0.1.0"
description = "Hands-on Claude API, Agent SDK, MCP and Claude Code practice for the Claude certification exam"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic==2.10.0",
    "python-dotenv==1.2.4",
    "aiohttp==3.14.5",
    "claude-agent-sdk==0.2.187",
    "pydantic==2.14.3",
    "mcp[cli]==2.3.0",
    "prompt-toolkit==3.0.53",
    "streamlit==1.67.0",
    "sympy==1.14.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.17.6",
    "mypy==2.4.1",
    "pytest>=8.0",
]

# This repo is a collection of scripts and projects, not an installable package.
[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 100
exclude = [".venv", "my_mcp_app/node_modules"]
