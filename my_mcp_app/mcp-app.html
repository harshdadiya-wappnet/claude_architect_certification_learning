<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Render Jobs</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 12px; }
      table { border-collapse: collapse; width: 100%; }
      th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #8884; }
      .badge { padding: 2px 8px; border-radius: 10px; font-size: 12px; color: #fff; }
      .needs_review { background: #d98a00; }
      .failed { background: #c0392b; }
      .approved { background: #2e8b57; }
      .rejected { background: #666; }
      .err { color: #c0392b; font-size: 12px; }
      .toolbar { margin-bottom: 10px; }
      button { margin-right: 4px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <label>Status
        <select id="filter">
          <option value="all">all</option>
          <option value="needs_review">needs_review</option>
          <option value="failed">failed</option>
          <option value="approved">approved</option>
          <option value="rejected">rejected</option>
        </select>
      </label>
      <span id="msg" class="err"></span>
      <small style="float:right;opacity:.5">view v2 · inline reject</small>
    </div>
    <table>
      <thead><tr><th>ID</th><th>Title</th><th>Status</th><th>Duration</th><th>Details</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <script type="module" src="/src/mcp-app.ts"></script>
  </body>
</html>
